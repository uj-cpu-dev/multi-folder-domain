name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      action:
        description: "What to run"
        type: choice
        default: deploy
        options:
          [deploy, plan, status, rollback, certs, reload-caddy, stop, start]
      folder_logs:
        description: "Folder name, to fetch its container logs instead"
        type: string
        default: ""

# Two pushes landing together would both see "no instance" and launch one each.
# This queues them instead of racing.
concurrency:
  group: deploy-multi-folder-domain
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      # Everything else lives in config.json, committed with the code.
      # No repository variables to set, nothing to remember in a web form.

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Read the region out of config.json
        run: |
          REGION=$(python -c "import json;print(json.load(open('config.json')).get('region','us-east-1'))")
          echo "AWS_REGION=$REGION"         >> "$GITHUB_ENV"
          echo "AWS_DEFAULT_REGION=$REGION" >> "$GITHUB_ENV"
          echo "region: $REGION"

      - name: Check the credentials actually arrived
        run: |
          if [ -z "${AWS_ACCESS_KEY_ID}" ] || [ -z "${AWS_SECRET_ACCESS_KEY}" ]; then
            echo "::error::AWS_ACCESS_KEY / AWS_SECRET_ACCESS_KEY are not set on this repository."
            exit 1
          fi
          pip install awscli --quiet
          aws sts get-caller-identity

      - name: Annotate any site.json problems (warnings only)
        run: |
          python - <<'PY'
          import json, re, pathlib
          host = re.compile(r"^(?=.{1,253}$)(?!-)[a-z0-9-]{1,63}(?<!-)(\.(?!-)[a-z0-9-]{1,63}(?<!-))+$")
          seen = {}
          for m in sorted(pathlib.Path(".").glob("*/site.json")):
              folder = m.parent.name
              try:
                  data = json.loads(m.read_text())
              except json.JSONDecodeError as e:
                  print(f"::warning file={m}::invalid JSON, this folder will be skipped: {e}")
                  continue
              names = [str(data.get("domain", "")).strip().lower()]
              names += [str(a).strip().lower() for a in data.get("aliases", [])]
              if not names[0]:
                  print(f"::notice file={m}::no domain set — this folder is ignored, not an error")
              for n in filter(None, names):
                  if not host.match(n):
                      print(f"::warning file={m}::'{n}' is not a valid hostname, this folder will be skipped")
                  if n in seen:
                      print(f"::warning file={m}::'{n}' is also claimed by {seen[n]}/, both will be skipped")
                  seen[n] = folder
              print(f"  {folder:<20} {', '.join(filter(None, names)) or '(no domain)'}")
          PY
        # Warnings only. deploy.py is the single source of truth: it ignores
        # drafts, skips broken folders, deploys the good ones, and decides the
        # exit code. Failing here would stop healthy sites deploying because of
        # one half-written folder.

      - name: Container logs
        if: ${{ inputs.folder_logs != '' }}
        run: python deploy.py --logs "${{ inputs.folder_logs }}"

      - name: Plan
        if: ${{ inputs.folder_logs == '' && inputs.action == 'plan' }}
        run: python deploy.py --plan

      - name: Status
        if: ${{ inputs.folder_logs == '' && inputs.action == 'status' }}
        run: python deploy.py --status

      - name: Rollback
        if: ${{ inputs.folder_logs == '' && inputs.action == 'rollback' }}
        run: python deploy.py --rollback

      - name: Stop the server
        if: ${{ inputs.folder_logs == '' && inputs.action == 'stop' }}
        run: python deploy.py --stop

      - name: Start the server
        if: ${{ inputs.folder_logs == '' && inputs.action == 'start' }}
        run: python deploy.py --start

      - name: Deploy
        if: ${{ inputs.folder_logs == '' && (inputs.action == 'deploy' || inputs.action == '') }}
        run: python deploy.py

      # ---------------------------------------------------------------------
      # Force Caddy to re-read its Caddyfile. Compose cannot see a changed
      # bind-mounted file, so a Caddyfile-only change leaves the old config
      # running. This does it directly over SSM and needs nothing from
      # deploy.py beyond its helper functions.
      # ---------------------------------------------------------------------
      - name: Reload Caddy
        if: ${{ inputs.folder_logs == '' && inputs.action == 'reload-caddy' }}
        run: |
          python - <<'PY'
          import importlib.util, sys
          spec = importlib.util.spec_from_file_location("deploy", "deploy.py")
          m = importlib.util.module_from_spec(spec); spec.loader.exec_module(m)
          inst = m.find_instance()
          if not inst:
              sys.exit("No instance found.")
          m.run_remote(inst["InstanceId"], [
              "set -eu",
              "cd /srv/mfd",
              "echo '--- Caddyfile on disk ---'",
              "head -8 Caddyfile",
              "echo '--- reloading ---'",
              "docker compose exec -T caddy caddy reload "
              "--config /etc/caddy/Caddyfile --adapter caddyfile "
              "|| docker compose restart caddy",
              "sleep 3",
              "docker compose ps --format '{{.Name}}\t{{.State}}\t{{.Status}}'",
          ], "reload caddy")
          PY

      # ---------------------------------------------------------------------
      # Certificates and DNS. Runs after a deploy even if the deploy failed,
      # and can be run on its own from the Actions tab with action = certs.
      #
      # Caddy can only get a certificate if the certificate authority can
      # reach THIS server at the domain. So the first thing to check is never
      # the certificate — it is where the name actually points.
      # ---------------------------------------------------------------------
      - name: Certificates and DNS — where the name points, what is served
        if: ${{ always() && env.MFD_SERVER_OFF != 'true' && inputs.folder_logs == '' && (inputs.action == 'deploy' || inputs.action == 'certs' || inputs.action == '') }}
        continue-on-error: true
        run: |
          set -u
          OUT=cert-report.txt
          : > "$OUT"

          # Every certificate probe below uses -k on purpose. Without it, curl
          # aborts the handshake on an untrusted certificate and prints NOTHING
          # about it — which is exactly the case this step exists to diagnose.
          # Whether a normal client trusts it is tested separately, without -k.

          SERVER_IP=$(python - <<'PY'
          import importlib.util
          spec = importlib.util.spec_from_file_location("deploy", "deploy.py")
          m = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(m)
          inst = m.find_instance()
          print((inst or {}).get("PublicIpAddress", ""))
          PY
          )

          {
            echo "=== 0. THE SERVER =============================================="
            echo "  public IP    : ${SERVER_IP:-UNKNOWN}"
            echo "  Every domain below must resolve to exactly this address."

            echo ""
            echo "=== 1. CONFIGURED ==============================================="
            python - <<'PY'
          import json, pathlib
          cfg = json.loads(pathlib.Path("config.json").read_text())
          staging = cfg.get("acme_staging", True)
          print(f"  acme_staging : {staging}")
          print(f"  acme_email   : {cfg.get('acme_email','') or '(none)'}")
          print("  expected CA  : " + (
              "Let's Encrypt STAGING — browsers will NOT trust this"
              if staging else
              "Let's Encrypt production — browsers will trust this"))
          PY

            echo ""
            echo "=== 2. DNS AND REACHABILITY ===================================="
            DOMAINS=$(python - <<'PY'
          import json, pathlib
          out = []
          for m in sorted(pathlib.Path(".").glob("*/site.json")):
              try:
                  d = json.loads(m.read_text())
              except Exception:
                  continue
              dom = str(d.get("domain", "")).strip()
              if not dom:
                  continue
              out.append(dom)
              out += [str(a).strip() for a in d.get("aliases", []) if str(a).strip()]
          print(" ".join(out))
          PY
          )
            [ -z "$DOMAINS" ] && echo "  (no domains configured yet)"

            DNS_PROBLEM=0
            FIRST_ISSUER=""
            FIRST_CODE=""

            for d in $DOMAINS; do
              echo ""
              echo "  --- $d"

              ips=$(getent ahostsv4 "$d" 2>/dev/null | awk '{print $1}' | sort -u | tr '\n' ' ')
              ips=$(echo $ips)
              if [ -z "$ips" ]; then
                echo "      dns          : DOES NOT RESOLVE"
                DNS_PROBLEM=1
              elif [ -n "$SERVER_IP" ] && [ "$ips" = "$SERVER_IP" ]; then
                echo "      dns          : $ips   OK"
              else
                echo "      dns          : $ips"
                echo "      *** MISMATCH : expected ${SERVER_IP:-?} — this name does NOT point at your server"
                DNS_PROBLEM=1
              fi

              # Port 80 is what the http-01 challenge uses. A registrar parking
              # page or URL-forwarding record shows up here as a redirect to an
              # address that is not the server.
              http=$(curl -sS -o /dev/null -m 20 \
                      -w 'reached %{remote_ip}  status %{http_code}  redirect "%{redirect_url}"' \
                      "http://$d/.well-known/acme-challenge/probe" 2>/dev/null \
                      || echo "could not connect")
              echo "      port 80      : $http"
              echo "                     (404 from YOUR server is normal here;"
              echo "                      a redirect, or any other IP, is not)"

              code=$(curl -ksS -o /dev/null -m 20 -w '%{http_code}' "https://$d" 2>/dev/null || echo "000")
              echo "      https status : $code   (000 = could not connect at all)"

              if curl -sS -o /dev/null -m 20 "https://$d" >/dev/null 2>&1; then
                echo "      trusted      : YES — a normal browser accepts this"
              else
                echo "      trusted      : NO  — browsers will warn"
              fi

              details=$(curl -ksv -o /dev/null -m 20 "https://$d" 2>&1 \
                        | grep -iE 'subject:|issuer:|start date|expire date' || true)
              if [ -n "$details" ]; then
                echo "$details" | sed 's/^\*//; s/^/     /'
              else
                echo "      (no certificate presented)"
              fi

              if [ -z "$FIRST_ISSUER$FIRST_CODE" ]; then
                FIRST_ISSUER=$(printf '%s' "$details" | grep -i 'issuer:' | head -1 || true)
                FIRST_CODE="$code"
              fi
            done

            echo ""
            echo "=== 3. WHAT CADDY SAID ========================================="
            python deploy.py --logs caddy 2>&1 \
              | grep -iE 'certificate|acme|tls\.|issuer|challenge|error|obtain|unauthorized' \
              | tail -40 \
              || echo "  (no certificate lines in the last 100 log lines)"

            echo ""
            echo "=== VERDICT ===================================================="
            if [ -z "$DOMAINS" ]; then
              echo "  Nothing to check."
            elif [ "$DNS_PROBLEM" = "1" ]; then
              echo "  DNS IS THE PROBLEM. Fix this before looking at anything else."
              echo ""
              echo "  One or more names above do not resolve to ${SERVER_IP:-your server}."
              echo "  Let's Encrypt has to reach THIS machine at that name to issue a"
              echo "  certificate, so until every A record points here, no certificate"
              echo "  can ever be issued and the errors in section 3 are a symptom,"
              echo "  not the cause."
              echo ""
              echo "  At your registrar, for EVERY name listed above:"
              echo "    - delete any URL Redirect / forwarding record"
              echo "    - delete any CNAME to a parking page"
              echo "    - add a plain A record pointing to ${SERVER_IP:-the IP above}"
            elif [ "$FIRST_CODE" = "000" ]; then
              echo "  DNS is right but nothing answers on 443. Check section 3."
            else
              case "$FIRST_ISSUER" in
                *STAGING*)
                  echo "  Serving a STAGING certificate."
                  echo ""
                  echo "  If section 1 says acme_staging: False, the new Caddyfile was"
                  echo "  shipped but the running Caddy never re-read it. Compose cannot"
                  echo "  see a changed bind-mounted file, so the container is left alone."
                  echo ""
                  echo "  Fix: Actions -> Run workflow -> action: reload-caddy"
                  echo "  Permanent fix: make sure deploy.py contains a 'caddy reload'"
                  echo "  line after 'docker compose up' — run: grep -n 'caddy reload' deploy.py" ;;
                *"Let's Encrypt"*)
                  echo "  Serving a real Let's Encrypt certificate. Nothing to do." ;;
                "")
                  echo "  The site answered ($FIRST_CODE) but presented no readable"
                  echo "  certificate. Check section 3." ;;
                *)
                  echo " $FIRST_ISSUER" ;;
              esac
            fi
          } 2>&1 | tee -a "$OUT"

          {
            echo ""
            echo "<details><summary>Certificate and DNS report</summary>"
            echo ""
            echo '```'
            cat "$OUT"
            echo '```'
            echo ""
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Summary
        if: always()
        run: |
          {
            echo "### multi-folder-domain"
            echo ""
            if [ "${MFD_SERVER_OFF:-}" = "true" ] \
               || [ "$(python -c "import json;print(json.load(open('config.json')).get('server_off',False))")" = "True" ]; then
              echo "> # 🔴 THE SERVER IS OFF"
              echo ">"
              echo "> **Your sites are down.** Nothing is answering on your domains."
              echo ">"
              echo "> The Elastic IP and the disk are still billing — an address that"
              echo "> is not attached to a *running* instance costs more, not less."
              echo ">"
              echo "> Turn it back on: set \`\"server_off\": false\` in \`config.json\` and push,"
              echo "> or run this workflow with **action: start**."
              echo ""
            fi
            echo ""
            echo "settings from \`config.json\`:"
            echo ""
            echo '```json'
            python -c "import json;d=json.load(open('config.json'));d.pop('_comment',None);print(json.dumps(d,indent=2))"
            echo '```'
            echo ""
            echo "| folder | domain | image |"
            echo "| --- | --- | --- |"
            for f in */site.json; do
              dir=$(dirname "$f")
              dom=$(python -c "
          import json,sys
          try:
              print(json.load(open(sys.argv[1])).get('domain','') or '_(no domain — ignored)_')
          except Exception:
              print('_(unreadable site.json)_')
          " "$f")
              if [ -f "$dir/Dockerfile" ]; then img="own Dockerfile"; else img="static (nginx)"; fi
              echo "| \`$dir\` | $dom | $img |"
            done
          } >> "$GITHUB_STEP_SUMMARY"
