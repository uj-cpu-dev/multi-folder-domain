# Serves this folder, including its subfolders, on one domain.
#
#   index.html            ->  orsaparcels.com/
#   tracking/index.html   ->  orsaparcels.com/tracking/
#
# Add another subfolder with its own index.html and it gets its own path.
# Nothing in deploy.py or the Caddyfile needs to know about it.

server {
  listen 80;
  server_name _;

  root  /usr/share/nginx/html;
  index index.html;

  # Without this, a request for /tracking (no trailing slash) is answered with
  # a redirect to http://orsaparcels.com/tracking/ — nginx has no idea it is
  # sitting behind Caddy, so it guesses http and the browser takes an extra
  # hop back up to https. "off" makes the redirect a plain /tracking/ instead,
  # which keeps the scheme it arrived on.
  absolute_redirect off;

  # THIS is why a fresh deploy kept needing Cmd+Shift+R.
  #
  # I gave the CSS and the JSON cache rules and left the HTML with none.
  # A response with no Cache-Control is not treated as "don't cache" — the
  # browser is allowed to guess, and it guesses roughly a tenth of the file's
  # age. An index.html edited a day ago gets held for a couple of hours, so
  # you push, reload, and get yesterday's page with no way to tell why.
  #
  # Saying "no-cache" out loud ends the guessing: the browser still keeps
  # the file, but it always asks first, and nginx answers 304 when nothing
  # changed. This line is the fix for the whole class of problem.
  location / {
    try_files $uri $uri/ =404;
    add_header Cache-Control "no-cache" always;
  }

  # data.json is the point of the tracking screen — never let a browser hold
  # on to an old copy, or an edit won't show up until someone clears a cache.
  location ~* \.json$ {
    add_header Cache-Control "no-store" always;
  }

  # Everything else is fine to cache for a week.
  # I had this at a week. That was wrong for a site you are still pushing to:
  # index.css never changes its name, so a browser that cached it would keep
  # the old one for seven days and your next deploy would look like it did
  # nothing. "no-cache" does not mean "don't cache" — it means "ask me first".
  # The browser keeps the file and sends one tiny check; nginx answers 304 and
  # sends no body unless it really changed. Nearly as fast, never stale.
  # Turn this into a long max-age once the site stops moving.
  # ("expires" would send a second, conflicting Cache-Control header.)
  location ~* \.(css|js|woff2?|png|jpe?g|svg|webp|ico)$ {
    add_header Cache-Control "no-cache" always;
  }

  access_log off;
}